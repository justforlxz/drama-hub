name: ci

# 本仓库为私有免费账号：分支保护 / rulesets 不可用（GitHub 403），
# 因此这里是「检出 + 报告」，不构成合并阻断。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ENGINE=docker ./scripts/ci.sh --lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # --test 跑两级：unit（--network=none）与 integration。integration 的
      # postgres:16 服务容器由 scripts/ci.sh 自己起（自定义网络 + healthcheck +
      # 退出清理），不依赖 workflow 里的 services: 块。
      - run: ENGINE=docker ./scripts/ci.sh --test
