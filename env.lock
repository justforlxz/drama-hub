# 环境锁。make env-check 会启动容器读取实际版本并与本文件比对，不一致即失败。
#
# 只固定 tag 不够：上游会重推镜像。用 digest 固定才是同一个文件系统，
# 也正因如此，不需要再枚举编码器/封装器 —— digest 固定后镜像内容不可能变。
#
# 升级版本时同时改这里、Containerfile 的 ARG 默认值，并重跑 make env-check。

BASE_IMAGE=alpine@sha256:ee16d92f96db08d9d2d07da48555a27f3a69d8f0759021dbc601195ed0d2b5bd
# 多架构发布要求这里是 index digest（不是单平台 manifest），否则 arm64 构建会拿
# amd64 工具链产出 amd64 二进制。amd64 那一层与旧的 bff16a94… 是同一个 manifest。
GO_IMAGE=golang@sha256:d200d2dd76b03a99b52651fd1325aff7dcd35422c35c01bac56571b0507f3deb

# 期望值：容器内实际输出的版本行。
GO_VERSION=go1.27.3
FFMPEG_VERSION=6.1.2

# staticcheck 版本，与 go 一起锁（版本错配会让检查结果不稳定）
STATICCHECK_VERSION=0.8.2

# integration 级测试用的 PostgreSQL 服务镜像（postgres:16 的多架构 index digest）。
# 同上：只固定 tag 挡不住上游重推，digest 才是同一个镜像。
PG_IMAGE=docker.io/library/postgres@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
