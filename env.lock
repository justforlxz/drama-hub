# 环境锁。make env-check 会启动容器读取实际版本并与本文件比对，不一致即失败。
#
# 只固定 tag 不够：上游会重推镜像。用 digest 固定才是同一个文件系统。
# 升级版本时同时改这里、Containerfile 的 ARG 默认值，并重跑 make env-check。

BASE_IMAGE=alpine@sha256:ee16d92f96db08d9d2d07da48555a27f3a69d8f0759021dbc601195ed0d2b5bd
GO_IMAGE=golang@sha256:bff16a94c0b4b6d9642581e2a3aa81beb3edb940b2f5a3aac1d22c6a68cb7747

# 期望值：容器内实际输出的版本行。
GO_VERSION=go1.27.3
FFMPEG_VERSION=6.1.2

# 分片引擎依赖的编码器/封装器。缺一个，copy 或转码兜底就会在运行期才炸。
FFMPEG_ENCODERS=libx264,libx265,aac,mpeg4
FFMPEG_MUXERS=mpegts,hls,mp4
