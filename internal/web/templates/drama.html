{{define "content"}}
<section class="page-head">
  <h1 id="drama-title">剧详情</h1>
  <p class="summary" id="drama-summary">读取中…</p>
</section>
<p class="notice" id="notice" role="status" aria-live="polite"></p>

<section class="card" id="drama-card" data-drama-id="{{.DramaID}}">
  <div class="card-body drama-head">
    <img class="drama-cover" id="drama-cover" alt="" hidden>
    <div class="stack">
      <dl class="kv" id="drama-meta"></dl>
      <p class="drama-plot" id="drama-plot"></p>
      <div>
        <p class="hint">WebDAV 路径（Jellyfin 看到的目录）</p>
        <div class="play-url">
          <code id="drama-webdav">读取中…</code>
          <button type="button" class="btn" id="drama-webdav-copy">复制</button>
        </div>
      </div>
      <div class="drama-actions">
        <button type="button" class="btn primary" id="drama-refresh">重新同步这部剧</button>
        <a class="btn" id="drama-back" href="/library">返回剧库</a>
      </div>
    </div>
  </div>
</section>

<section class="card" aria-labelledby="chunk-title">
  <header class="card-head">
    <div>
      <h2 id="chunk-title">集</h2>
      <p class="card-sub" id="chunk-info">读取中…</p>
    </div>
  </header>
  <div class="card-body">
    <div class="chunk-list" id="chunk-list"></div>
    <p class="hint">块按当前「合并分块集数」切分；对外集号与播放地址都由后端派生，改分块数会立刻改变对外集号。</p>
  </div>
</section>
{{end}}
