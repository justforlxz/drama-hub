{{define "content"}}
<section class="page-head">
  <h1>剧库</h1>
  <p class="summary" id="library-summary">读取中…</p>
</section>
<p class="notice" id="notice" role="status" aria-live="polite"></p>

<div class="toolbar">
  <label class="field">
    <span class="field-label">搜索</span>
    <input id="library-search" type="search" autocomplete="off" spellcheck="false"
           placeholder="剧名或上游 id">
  </label>
  <label class="field">
    <span class="field-label">分类</span>
    <select id="library-genre">
      <option value="">全部分类</option>
    </select>
  </label>
  <label class="field">
    <span class="field-label">状态</span>
    <select id="library-filter">
      <option value="">全部</option>
      <option value="no-cover">无封面</option>
      <option value="incomplete">集数不齐</option>
    </select>
  </label>
  <div class="toolbar-actions">
    <button type="button" class="btn" id="library-view-list" aria-pressed="true">列表</button>
    <button type="button" class="btn" id="library-view-wall" aria-pressed="false">海报墙</button>
    <button type="button" class="btn" id="lookup-toggle" aria-expanded="false" aria-controls="lookup">补录</button>
  </div>
</div>

<details class="card" id="lookup">
  <summary>补录 / 查一部剧</summary>
  <div class="card-body">
    <form class="lookup-form" id="drama-form">
      <label class="field">
        <span class="field-label">上游剧 id 或 /player/ 链接</span>
        <input id="series-id" name="series_id" autocomplete="off" spellcheck="false"
               placeholder="如 123456 或 https://…/player/123456">
      </label>
      <button type="submit" class="btn" id="drama-submit">同步入库</button>
    </form>
    <p class="notice" id="drama-notice" role="status" aria-live="polite"></p>
    <p class="hint">新建返回 201；已在库返回 200，这次只更新，不会重复建。</p>
  </div>
</details>

<!-- 台账用 ARIA 的 table/row/cell 语义 + CSS Grid 排版，不用 <table>（移动端按行塌成卡片）。 -->
<div class="ledger" id="library-ledger" role="table" aria-label="剧库台账">
  <div class="ledger-head" role="row">
    <span role="columnheader">封面</span>
    <span role="columnheader">标题</span>
    <span role="columnheader">年份</span>
    <span role="columnheader">分类</span>
    <span role="columnheader">集数</span>
    <span role="columnheader">上游 id</span>
    <span role="columnheader">上次同步</span>
    <span role="columnheader">Jellyfin</span>
    <span role="columnheader">操作</span>
  </div>
  <div id="library-rows" role="rowgroup"></div>
</div>

<div class="wall" id="library-wall" hidden></div>
<p class="hint" id="library-empty" hidden>没有符合筛选条件的剧。</p>

<div class="pager" id="library-pager" hidden>
  <button type="button" class="btn" id="pager-prev">上一页</button>
  <span class="pager-info" id="pager-info"></span>
  <button type="button" class="btn" id="pager-next">下一页</button>
</div>
{{end}}
