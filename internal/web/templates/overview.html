{{define "content"}}
<section class="page-head">
  <h1>概览</h1>
  <p class="summary" id="summary">读取中…</p>
</section>
<p class="notice" id="notice" role="status" aria-live="polite"></p>
<p class="hint" id="write-hint"></p>

<div class="columns">
  <div class="stack" id="sources" aria-label="播放源">
    <p class="state" data-state="loading">读取中…</p>
  </div>

  <section class="card" aria-labelledby="jellyfin-title">
    <header class="card-head">
      <div>
        <h2 id="jellyfin-title">Jellyfin 媒体库</h2>
        <p class="card-sub" id="jellyfin-when">读取中…</p>
      </div>
      <span class="badge" data-tone="muted" id="jellyfin-badge">读取中</span>
    </header>
    <div class="card-body">
      <p class="notice" id="jellyfin-progress"></p>
      <div class="switch-list" id="jellyfin-categories" aria-label="按分类启用的媒体库">
        <p class="state" data-state="loading">读取中…</p>
      </div>
      <div class="issues" id="jellyfin-issues"></div>
      <p class="hint">一分类一库；关掉的分类会在下一轮同步时删掉对应的库（点「同步媒体库」则当场删）。分类消失只列成「孤儿库」，不会删。</p>
    </div>
    <footer class="card-foot">
      <button type="button" class="btn primary" id="jellyfin-sync">同步媒体库</button>
      <p class="hint" id="jellyfin-hint"></p>
    </footer>
  </section>
</div>

<section class="card" id="playback" aria-labelledby="playback-title">
  <header class="card-head">
    <div>
      <h2 id="playback-title">正在播放</h2>
      <p class="card-sub" id="playback-summary">读取中…</p>
    </div>
    <span class="badge" data-tone="muted" id="playback-badge">读取中</span>
  </header>
  <div class="card-body">
    <p class="state" data-state="empty" id="playback-empty">当前没有播放</p>
    <div class="playback-list" id="playback-list"></div>
    <p class="hint">会话只存在内存里，服务重启即清空；超过「播放会话保留时长」没有请求就自动消失。同步轮次取数不算播放。</p>
  </div>
</section>

<details class="card" id="lookup">
  <summary>补录 / 查一部剧</summary>
  <div class="card-body">
    <form class="lookup-form" id="drama-form">
      <label class="field">
        <span class="field-label">上游剧 id 或 /player/ 链接</span>
        <input id="series-id" name="series_id" autocomplete="off" spellcheck="false"
               placeholder="如 123456 或 https://…/player/123456">
      </label>
      <button type="submit" class="btn" id="drama-submit">同步入库</button>
    </form>
    <p class="notice" id="drama-notice" role="status" aria-live="polite"></p>
    <p class="hint">新建返回 201；已在库返回 200，这次只更新，不会重复建。</p>
  </div>
</details>
{{end}}
